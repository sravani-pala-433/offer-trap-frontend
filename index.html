<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191a1e" />
    <meta name="description" content="Investigate suspicious recruitment offers and help job seekers stay informed." />
    <title>OfferTrap — Look beyond the offer</title>
    <script>
      try {
        const saved = localStorage.getItem('offertrap-theme-v2');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : 'dark';
        document.documentElement.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = theme === 'dark' ? '#191a1e' : '#f8f5ef';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
